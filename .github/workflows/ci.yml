name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: node --test tests/mail.test.mjs
      - run: npm run build
      - run: npm run db:local
      - name: Integration tests against local Worker
        shell: bash
        run: |
          npm run dev > /tmp/slotforge-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:5173/api/health >/dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
